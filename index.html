<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TEAMINSTA — PP</title>
<style>
  :root { color-scheme: dark; }
  html,body{height:100%;margin:0}
  body{
    background:#111317;color:#e7e9ee;
    font:500 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .card{max-width:420px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.3px}
  p{margin:6px 0;color:#9aa1ad}
  .spin{width:34px;height:34px;margin:18px auto;border:3px solid #2a2e37;border-top-color:#8ab4ff;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a.btn{display:none;margin-top:16px;padding:12px 18px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
  code{color:#c7cdd8}
</style>
</head>
<body>
  <div class="card">
    <h1>📸 TEAMINSTA — PP</h1>
    <p id="msg">Ouverture de l'outil…</p>
    <div class="spin" id="spin"></div>
    <a class="btn" id="go" href="#">Ouvrir l'outil maintenant →</a>
    <p style="margin-top:22px;font-size:13px">Garde ce lien en favori — il ne change <b>jamais</b>.</p>
  </div>
<script>
// Porte d'entrée permanente et AUTO-RÉPARANTE.
// La cible (le tunnel vivant du moment) est lue dans url.txt du dépôt, mise à
// jour par le watchdog à chaque rotation. On NE redirige JAMAIS vers un tunnel
// sans l'avoir d'abord SONDÉ : si le tunnel est mort (erreur « serveur
// introuvable »), on réessaie tout seul toutes les 5 s au lieu d'envoyer le VA
// dans un cul-de-sac. Dès que le watchdog reconstruit le tunnel, cette page
// repart automatiquement, sans aucune action du VA.
var OWNER = "nexus458", REPO = "pp-link";

function lireUrl(){
  var API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/url.txt?ref=main&t=" + Date.now();
  var RAW = "url.txt?t=" + Date.now();
  return fetch(API, {headers:{"Accept":"application/vnd.github.raw+json"}, cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .catch(function(){
      return fetch(RAW, {cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.text(); });
    });
}

// Sonde l'origine du tunnel. no-cors : on ne lit pas le corps, mais une adresse
// morte (DNS introuvable / connexion refusée = l'erreur Safari du VA) fait
// REJETER la promesse → on sait qu'il faut réessayer. Une adresse vivante
// résout → on peut rediriger sans risque.
function sonder(origine){
  return fetch(origine + "/?__ping=" + Date.now(), {mode:"no-cors", cache:"no-store"})
    .then(function(){ return true; })
    .catch(function(){ return false; });
}

function essayer(){
  lireUrl().then(function(t){
    t = (t || "").trim();
    if (!/^https:\/\//.test(t)) { return reessayer(""); }
    var m = t.match(/^https:\/\/[^\/?#]+/);
    var origine = m ? m[0] : "";
    sonder(origine).then(function(ok){
      if (ok) {
        document.getElementById("msg").textContent = "C'est prêt.";
        location.replace(t);
      } else {
        reessayer(t);
      }
    });
  }).catch(function(){ reessayer(""); });
}

function reessayer(t){
  document.getElementById("msg").textContent = "Reconnexion en cours… (automatique, patiente quelques secondes)";
  if (t) {
    var a = document.getElementById("go");
    a.href = t; a.style.display = "inline-block";   // bouton de secours si le VA veut forcer
  }
  setTimeout(essayer, 5000);
}

essayer();
</script>
</body>
</html>
